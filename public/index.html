<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grand CyberSec Hotel - Booking System</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">

    <!-- Navbar -->
    <nav class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-hotel text-blue-500 text-2xl"></i>
                <h1 class="text-xl font-bold text-white tracking-wide">Grand CyberSec Hotel</h1>
            </div>
            <div id="userStatus" class="flex items-center gap-4 hidden">
                <span id="userInfo" class="text-sm font-medium bg-slate-700 px-3 py-1.5 rounded-full border border-slate-600"></span>
                <button onclick="logout()" class="text-sm text-red-400 hover:text-red-300 font-semibold flex items-center gap-1 transition">
                    <i class="fa-solid fa-right-from-bracket"></i> Logout
                </button>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4 py-8 space-y-8">

        <!-- 1. Form Auth (Login / Register) -->
        <div id="authSection" class="max-w-md mx-auto bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl">
            <div class="flex justify-center border-b border-slate-700 mb-6 pb-2 gap-4">
                <button id="tabLoginBtn" onclick="switchAuthTab('login')" class="font-semibold text-blue-400 border-b-2 border-blue-500 pb-2 px-4 transition">Login</button>
                <button id="tabRegBtn" onclick="switchAuthTab('register')" class="font-semibold text-slate-400 pb-2 px-4 transition">Registrasi</button>
            </div>

            <form id="authForm" onsubmit="handleAuth(event)" class="space-y-4">
                <div>
                    <label class="block text-xs text-slate-400 mb-1 font-medium">Username</label>
                    <input type="text" id="username" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 focus:outline-none focus:border-blue-500 text-sm">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1 font-medium">Password</label>
                    <input type="password" id="password" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 focus:outline-none focus:border-blue-500 text-sm">
                </div>
                <div id="roleSelectGroup" class="hidden">
                    <label class="block text-xs text-slate-400 mb-1 font-medium">Hak Akses (Role)</label>
                    <select id="role" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 focus:outline-none focus:border-blue-500 text-sm text-slate-300">
                        <option value="customer">Customer (Tamu)</option>
                        <option value="admin">Admin (Resepsionis)</option>
                    </select>
                </div>
                <button type="submit" id="authSubmitBtn" class="w-full bg-blue-600 hover:bg-blue-500 font-semibold py-2.5 rounded-lg text-sm transition shadow-lg shadow-blue-900/40">
                    Masuk Sekarang
                </button>
            </form>
        </div>

        <!-- 2. Main Dashboard (Setelah Login) -->
        <div id="mainDashboard" class="hidden space-y-8">
            
            <!-- Admin CRUD & Control Panel -->
            <div id="adminPanel" class="hidden bg-slate-800 p-6 rounded-2xl border border-amber-500/30 space-y-6">
                <div class="flex justify-between items-center border-b border-slate-700 pb-4">
                    <div class="flex items-center gap-2 text-amber-400">
                        <i class="fa-solid fa-user-shield text-xl"></i>
                        <h2 class="text-lg font-bold">Panel Admin - Kelola Kamar & Laporan</h2>
                    </div>
                    <button onclick="exportCSV()" class="bg-emerald-600 hover:bg-emerald-500 text-xs font-semibold px-4 py-2 rounded-lg flex items-center gap-2 transition">
                        <i class="fa-solid fa-file-csv text-base"></i> Ekspor Laporan CSV
                    </button>
                </div>

                <!-- Form Tambah Kamar (CRUD Create) -->
                <form onsubmit="handleAddRoom(event)" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <input type="text" id="newRoomName" placeholder="Nama Tipe Kamar Baru" required class="bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-blue-500">
                    <input type="number" id="newRoomPrice" placeholder="Harga per Malam (Rp)" required class="bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-blue-500">
                    <button type="submit" class="bg-amber-600 hover:bg-amber-500 font-semibold text-sm py-2 rounded-lg transition flex items-center justify-center gap-2">
                        <i class="fa-solid fa-plus"></i> Tambah Kamar (CRUD)
                    </button>
                </form>

                <!-- Rekap Data Ringkas -->
                <div class="bg-slate-900 p-4 rounded-xl border border-slate-700/60">
                    <button onclick="getAdminReport()" class="text-xs text-blue-400 hover:underline font-semibold flex items-center gap-1">
                        <i class="fa-solid fa-chart-line"></i> Refresh Rekap Laporan Keuangan
                    </button>
                    <pre id="recapOutput" class="mt-2 text-xs text-slate-300 bg-slate-950 p-3 rounded-lg overflow-x-auto border border-slate-800">Klik tombol di atas untuk menampilkan json rekap.</pre>
                </div>
            </div>

            <!-- Katalog Kamar Hotel Grid -->
            <div>
                <div class="flex justify-between items-center mb-6">
                    <div>
                        <h2 class="text-2xl font-bold text-white">Katalog Kamar Hotel</h2>
                        <p class="text-xs text-slate-400 mt-1">Pilih kamar yang sesuai dengan kebutuhan Anda</p>
                    </div>
                    <button onclick="loadRooms()" class="text-xs text-slate-400 hover:text-white flex items-center gap-1 bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700">
                        <i class="fa-solid fa-rotate"></i> Refresh
                    </button>
                </div>

                <div id="roomsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <!-- Cards kamar akan di-render dinamis melalui JavaScript -->
                </div>
            </div>

        </div>

    </div>

    <script>
        let isLoginTab = true;
        let currentUserRole = null;

        function switchAuthTab(tab) {
            isLoginTab = tab === 'login';
            document.getElementById('tabLoginBtn').className = isLoginTab ? 'font-semibold text-blue-400 border-b-2 border-blue-500 pb-2 px-4 transition' : 'font-semibold text-slate-400 pb-2 px-4 transition';
            document.getElementById('tabRegBtn').className = !isLoginTab ? 'font-semibold text-blue-400 border-b-2 border-blue-500 pb-2 px-4 transition' : 'font-semibold text-slate-400 pb-2 px-4 transition';
            document.getElementById('roleSelectGroup').className = !isLoginTab ? 'block' : 'hidden';
            document.getElementById('authSubmitBtn').innerText = isLoginTab ? 'Masuk Sekarang' : 'Daftar Akun Baru';
        }

        async function handleAuth(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const role = document.getElementById('role').value;

            const endpoint = isLoginTab ? '/api/login' : '/api/register';
            const bodyData = isLoginTab ? { username, password } : { username, password, role };

            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(bodyData)
                });
                const data = await res.json();

                if (!res.ok) throw new Error(data.error || 'Terjadi kesalahan.');

                alert(data.message);
                if (isLoginTab) {
                    currentUserRole = data.role;
                    showDashboard(data.username, data.role);
                } else {
                    switchAuthTab('login');
                }
            } catch (err) {
                alert(err.message);
            }
        }

        function showDashboard(username, role) {
            document.getElementById('authSection').classList.add('hidden');
            document.getElementById('mainDashboard').classList.remove('hidden');
            document.getElementById('userStatus').classList.remove('hidden');
            document.getElementById('userInfo').innerHTML = `<i class="fa-solid fa-user text-blue-400 mr-1"></i> ${username} (<span class="uppercase text-xs text-blue-300 font-bold">${role}</span>)`;

            if (role === 'admin') {
                document.getElementById('adminPanel').classList.remove('hidden');
            }
            loadRooms();
        }

        async function loadRooms() {
            try {
                const res = await fetch('/api/rooms');
                if (!res.ok) return;
                const rooms = await res.json();

                const grid = document.getElementById('roomsGrid');
                grid.innerHTML = '';

                rooms.forEach(room => {
                    const card = document.createElement('div');
                    card.className = 'bg-slate-800 rounded-2xl border border-slate-700 overflow-hidden shadow-lg hover:border-slate-600 transition flex flex-col justify-between';
                    card.innerHTML = `
                        <div>
                            <div class="h-44 bg-slate-700 relative flex items-center justify-center">
                                <i class="fa-solid fa-bed text-5xl text-slate-500"></i>
                                <span class="absolute top-3 right-3 bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 text-xs px-2.5 py-1 rounded-full font-semibold">
                                    ${room.status}
                                </span>
                            </div>
                            <div class="p-5 space-y-2">
                                <h3 class="text-lg font-bold text-white">${room.name}</h3>
                                <p class="text-blue-400 text-xl font-extrabold">Rp ${room.price.toLocaleString('id-ID')} <span class="text-xs text-slate-400 font-normal">/ malam</span></p>
                                <p class="text-xs text-slate-400">Fasilitas: AC, Free Wi-Fi, Breakfast, Smart TV</p>
                            </div>
                        </div>
                        <div class="p-5 pt-0">
                            <div class="space-y-2">
                                <input type="date" id="date-${room.id}" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-slate-300 focus:outline-none focus:border-blue-500">
                                <button onclick="bookRoom(${room.id})" class="w-full bg-blue-600 hover:bg-blue-500 font-semibold py-2 rounded-lg text-xs transition flex items-center justify-center gap-2">
                                    <i class="fa-solid fa-calendar-check"></i> Pesan Kamar
                                </button>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (err) {
                console.error(err);
            }
        }

        async function bookRoom(roomId) {
            const checkInDate = document.getElementById(`date-${roomId}`).value;
            if (!checkInDate) return alert('Silakan pilih tanggal check-in terlebih dahulu!');

            try {
                const res = await fetch('/api/bookings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ roomId, checkInDate })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error);
                alert(data.message);
            } catch (err) {
                alert(err.message);
            }
        }

        async function handleAddRoom(e) {
            e.preventDefault();
            const name = document.getElementById('newRoomName').value;
            const price = document.getElementById('newRoomPrice').value;

            try {
                const res = await fetch('/api/rooms/add', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, price })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error);
                alert(data.message);
                document.getElementById('newRoomName').value = '';
                document.getElementById('newRoomPrice').value = '';
                loadRooms();
            } catch (err) {
                alert(err.message);
            }
        }

        async function getAdminReport() {
            try {
                const res = await fetch('/api/reports/recap');
                const data = await res.json();
                document.getElementById('recapOutput').innerText = JSON.stringify(data, null, 2);
            } catch (err) {
                alert('Gagal mengambil laporan admin.');
            }
        }

        function exportCSV() {
            window.location.href = '/api/reports/export-csv';
        }

        async function logout() {
            await fetch('/api/logout', { method: 'POST' });
            location.reload();
        }
    </script>
</body>
</html>
