<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Sistem Pemesanan Kamar Hotel</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f4f6f9; }
        .card { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        input, button { padding: 10px; margin: 5px 0; width: 100%; max-width: 300px; display: block; }
        button { background: #007bff; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <h2>Hotel Booking App - Task Cyber Security</h2>
    <div class="card">
        <h3>Registrasi / Login</h3>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <select id="role" style="padding:10px; margin: 5px 0;">
            <option value="customer">Customer</option>
            <option value="admin">Admin</option>
        </select>
        <button onclick="register()">Daftar</button>
        <button onclick="login()">Login</button>
    </div>

    <div class="card">
        <h3>Menu Resepsionis / Admin (Laporan)</h3>
        <button onclick="getReport()">Lihat Rekap Laporan (Admin Only)</button>
        <button onclick="exportCSV()">Ekspor Laporan CSV</button>
        <pre id="output"></pre>
    </div>

    <script>
        async function register() {
            const res = await fetch('/api/register', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    username: document.getElementById('username').value,
                    password: document.getElementById('password').value,
                    role: document.getElementById('role').value
                })
            });
            const data = await res.json();
            alert(data.message || data.error);
        }

        async function login() {
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    username: document.getElementById('username').value,
                    password: document.getElementById('password').value
                })
            });
            const data = await res.json();
            alert(data.message || data.error);
        }

        async function getReport() {
            const res = await fetch('/api/reports/recap');
            const data = await res.json();
            document.getElementById('output').innerText = JSON.stringify(data, null, 2);
        }

        function exportCSV() {
            window.location.href = '/api/reports/export-csv';
        }
    </script>
</body>
</html>
